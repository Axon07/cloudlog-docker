name: Build Cloudlog image

# Checks magicbug/Cloudlog every 4 hours and builds when something new appears:
#   stable -> newest Cloudlog release/tag   => :latest and :<version>
#   dev    -> newest commit on master       => :dev and :dev-<sha>
# Nothing is rebuilt if that exact version/commit already exists in GHCR.

on:
  schedule:
    - cron: "23 */4 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: write     # keepalive commit only
  packages: write

concurrency:
  group: cloudlog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, dev]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/cloudlog"
          if [ "${{ matrix.channel }}" = "stable" ]; then
            REF=$(gh api repos/magicbug/Cloudlog/releases/latest -q .tag_name 2>/dev/null || true)
            if [ -z "$REF" ]; then
              REF=$(gh api --paginate repos/magicbug/Cloudlog/tags -q '.[].name' | sort -V | tail -1)
            fi
            TAG=$(echo "$REF" | tr '/' '-')
            TAGS="${IMAGE}:${TAG},${IMAGE}:latest"
          else
            REF=master
            SHA=$(gh api repos/magicbug/Cloudlog/commits/master -q '.sha[0:7]')
            TAG="dev-${SHA}"
            TAGS="${IMAGE}:${TAG},${IMAGE}:dev"
          fi
          echo "Upstream ${{ matrix.channel }}: $REF -> $TAG"
          {
            echo "image=$IMAGE"
            echo "ref=$REF"
            echo "tag=$TAG"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip if already built
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || \
             { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "true" ]; }; then
            if docker manifest inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
              echo "Already built ${{ steps.v.outputs.tag }} - nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CLOUDLOG_REF=${{ steps.v.outputs.ref }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}

  # GitHub disables scheduled workflows after 60 days without repo activity.
  # This pushes an empty commit when the repo has been quiet for 45+ days.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Keep schedule alive
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Last commit $AGE days ago"
          if [ "$AGE" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
          fi
